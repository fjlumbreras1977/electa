 document.querySelector('[role=tablist]').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=tools.findIndex(t=>t.id===tool),next=e.key==='Home'?0:e.key==='End'?tools.length-1:(i+(e.key==='ArrowRight'?1:-1)+tools.length)%tools.length;tool=tools[next].id;resetInteraction();save();renderWorkspace();document.querySelector('[data-tool="'+tool+'"]').focus();};

function partySummary(){return data.parties.slice(0,8).map(p=>`<div class="inspector-party"><i class="party-dot" style="background:${p.color}"></i><span>${esc(p.name)}</span><b>${fmt(p.seats)}</b><span>esc.</span></div>`).join('')+(data.parties.length>8?`<p class="inspector-sub">Y ${data.parties.length-8} formaciones más.</p>`:'');}
function bindSettings(){document.querySelectorAll('[data-setting]').forEach(input=>input.oninput=()=>{
 const key=input.dataset.setting,oldTotal=data.totalSeats;
 data[key]=input.type==='number'?(input.value===''?null:Number(input.value)):input.type==='checkbox'?input.checked:input.value;
 if(key==='totalSeats'&&Number.isInteger(data.totalSeats)&&data.totalSeats>0&&data.totalSeats<=2000&&(!Number.isInteger(data.majority)||data.majority===Math.floor(oldTotal/2)+1)){
  data.majority=Math.floor(data.totalSeats/2)+1;document.querySelectorAll('[data-setting="majority"]').forEach(x=>x.value=data.majority);
 }
 if(key==='updated'){const date=input.value?new Date(input.value):null;data.updated=date&&Number.isFinite(date.getTime())?date.toISOString():null;}
 save();updateCoverage();if(page==='workspace')renderWidget();if(page==='data')updateValidation();
});}

function widgetShell(content){const t=tools.find(t=>t.id===tool);return`<article class="widget ${theme==='dark'?'dark':''}" aria-label="${esc(t.title)}"><header class="widget-head"><div><div class="widget-eyebrow">${esc(data.territory)} ${data.demo?'<span class="badge">SIMULACIÓN</span>':''}</div><h2>${tool==='pacts'?'¿Quién suma para gobernar?':tool==='hemi'?'Así queda la cámara':tool==='compare'?'Cómo cambia el parlamento':tool==='turnout'?'La participación, en cifras':esc(data.title)}</h2><div class="widget-subtitle">${tool==='pacts'?`${data.totalSeats} escaños · La mayoría absoluta está en ${data.majority}`:tool==='hemi'?`${esc(data.title)} · ${data.totalSeats} escaños`:tool==='compare'?`${esc(data.title)} · Escaños actuales frente a anteriores`:tool==='turnout'?esc(data.title):'Resultados '+(data.counted===100?'introducidos':'provisionales')+' · Reparto de escaños'}</div></div>${['results','hemi'].includes(tool)?`<div class="counted">${pct(data.counted)}<small>escrutado</small></div>`:''}</header>${content}<footer class="widget-source"><div>Fuente: ${esc(data.source)}<br>Actualización: ${esc(dateLabel(data.updated))}${data.demo?' · Datos ficticios':''}</div><div class="widget-brand">electa<span>.</span> <span style="color:var(--wmuted);font-size:7px;font-weight:400">by DRÖMA</span></div></footer></article>`;}
function renderWidget(){const mount=isWidget?$('app'):$('widgetMount');if(!mount)return;const active=document.activeElement,focus=mount.contains(active)?{id:active.id,mode:active.dataset.resultsMode}:null;const errors=C.issues(data).errors;if(errors.length){mount.innerHTML='<div class="compact-err"><b>Revisa los datos para continuar</b><p>'+errors.map(esc).join('<br>')+'</p></div>';return;}let content='';if(tool==='results')content=resultsHTML();if(tool==='pacts')content=pactsHTML();if(tool==='hemi')content=hemiHTML();if(tool==='compare')content=compareHTML();if(tool==='turnout')content=turnoutHTML();mount.innerHTML=widgetShell(content);bindWidget(mount);if(focus){const target=focus.id?mount.querySelector('#'+focus.id):focus.mode?mount.querySelector('[data-results-mode="'+focus.mode+'"]'):null;target?.focus({preventScroll:true});}if(isWidget)requestAnimationFrame(()=>{if(window.parent!==window)window.parent.postMessage({type:'electa:resize',height:document.documentElement.scrollHeight},'*');});}
function sorted(){return [...data.parties].sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'es'):b[sort]-a[sort]||b.seats-a.seats);}
function resultsHTML(){const parties=sorted(),max=Math.max(...parties.map(p=>p.pct),1);return`<div class="widget-tabs"><button data-results-mode="chart" class="${resultsMode==='chart'?'active':''}" aria-pressed="${resultsMode==='chart'}">Gráfico</button><button data-results-mode="table" class="${resultsMode==='table'?'active':''}" aria-pressed="${resultsMode==='table'}">Tabla de datos</button><label style="margin-left:auto;font-size:9px;color:var(--wmuted)">Ordenar <select id="resultSort" aria-label="Ordenar resultados" style="border:0;background:var(--wbg);color:var(--wtext);font-size:9px;padding:5px"><option value="seats" ${sort==='seats'?'selected':''}>Por escaños</option><option value="pct" ${sort==='pct'?'selected':''}>Por voto</option><option value="name" ${sort==='name'?'selected':''}>Por nombre</option></select></label></div>${resultsMode==='table'?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Partido</th><th>Votos</th><th>% voto</th><th>Escaños</th></tr></thead><tbody>${parties.map(p=>`<tr><td><span class="party-name"><i class="party-dot" style="background:${p.color}"></i>${esc(p.name)}</span></td><td>${fmt(p.votes)}</td><td>${pct(p.pct)}</td><td>${fmt(p.seats)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="results-labels"><span>FORMACIÓN</span><span></span><span>% VOTO</span><span>ESC.</span></div>${parties.map(p=>`<div class="result-row"><div class="party-name"><i class="party-dot" style="background:${p.color}"></i><span title="${esc(p.name)}">${esc(p.name)}</span></div><div class="bar-track" role="img" aria-label="${esc(p.name)}: ${pct(p.pct)}, ${p.seats} escaños"><div class="bar-fill" style="width:${p.pct/max*100}%;background:${p.color}"></div></div><strong>${fmt(p.pct,1)}<span style="font-weight:400;font-size:8px">%</span></strong><div class="seat-count">${p.seats}</div></div>`).join('')}`}`;}
function pactsHTML(){const m=C.coalition(data,roles,rule);return`<p class="pact-intro">${rule==='simple'?'Asigna votos a favor, en contra y abstenciones para explorar una votación.':'Selecciona los partidos que sumarías a tu pacto. Prueba, combina y descubre las mayorías.'}</p><div class="pact-layout"><div class="pact-list ${rule==='simple'?'simple-list':''}">${data.parties.map(p=>rule==='simple'?`<div class="pact-row"><i class="party-dot" style="background:${p.color}"></i><span>${esc(p.name)}</span><strong>${p.seats}</strong><select data-role="${p.id}" aria-label="Posición de ${esc(p.name)}"><option value="no" ${!roles[p.id]||roles[p.id]==='no'?'selected':''}>En contra</option><option value="yes" ${roles[p.id]==='yes'?'selected':''}>A favor</option><option value="abstain" ${roles[p.id]==='abstain'?'selected':''}>Abstención</option></select></div>`:`<label class="pact-row ${roles[p.id]==='yes'?'checked':''}"><input type="checkbox" data-pact="${p.id}" ${roles[p.id]==='yes'?'checked':''}><i class="party-dot" style="background:${p.color}"></i><span>${esc(p.name)}</span><strong>${p.seats}</strong></label>`).join('')}</div><div class="pact-summary" role="status" aria-live="polite"><div class="pact-number">${m.yes}<small> / ${rule==='simple'?data.totalSeats:data.majority}</small></div><p>${rule==='simple'?`${m.no} en contra · ${m.abstain} abstenciones`:'escaños a favor del pacto'}</p><div class="pact-message ${m.passed?'success':''}">${m.passed?(m.provisional?(rule==='simple'?'Más síes que noes · Reparto provisional':'Mayoría absoluta · Reparto provisional'):rule==='simple'?'Más síes que noes':'Mayoría absoluta alcanzada'):rule==='simple'?(m.yes===m.no?'Empate: no se alcanza mayoría':'Los síes no superan a los noes'):`Faltan ${m.missing} escaños para la mayoría`}</div></div></div><div class="pact-bar" role="img" aria-label="${m.yes} escaños favorables de ${data.totalSeats}">${data.parties.filter(p=>roles[p.id]==='yes').map(p=>`<span style="width:${p.seats/data.totalSeats*100}%;background:${p.color}"></span>`).join('')}${rule==='absolute'?`<i class="majority-line" style="left:${data.majority/data.totalSeats*100}%"></i>`:''}</div><div class="majority-caption">${rule==='absolute'?`↑ Mayoría absoluta: ${data.majority} escaños`:`Síes: ${m.yes} · Noes: ${m.no} · Abstenciones: ${m.abstain}`}</div><div class="pact-tools"><select id="pactRule" aria-label="Regla de mayoría"><option value="absolute" ${rule==='absolute'?'selected':''}>Mayoría absoluta</option><option value="simple" ${rule==='simple'?'selected':''}>Mayoría simple · Síes frente a noes</option></select><button id="clearPact">Limpiar combinación</button></div>${m.pending?`<p class="pact-intro" style="margin:12px 0 0;font-size:9px">Reparto provisional: quedan ${m.pending} escaños sin asignar. ${rule==='simple'?'La comparación puede cambiar con los escaños pendientes.':''}</p>`:''}<p style="font-size:8px;color:var(--wmuted);line-height:1.7;margin:12px 0 0">Simulación aritmética. No implica acuerdos entre partidos. Las reglas de cada votación dependen del procedimiento y la jurisdicción.</p>`;}
function hemiHTML(){const total=data.totalSeats,assigned=data.parties.reduce((s,p)=>s+p.seats,0),all=[];for(const p of data.parties)for(let j=0;j<p.seats;j++)all.push(p);for(let j=assigned;j<total;j++)all.push({id:'pending',name:'Sin asignar',color:'#dde1d5'});
 const rows=Math.max(3,Math.ceil(Math.sqrt(total)/2.7)),radii=Array.from({length:rows},(_,i)=>86+i*22),weight=radii.reduce((s,r)=>s+r,0);let counts=radii.map(r=>Math.floor(total*r/weight));let left=total-counts.reduce((s,n)=>s+n,0);for(let i=counts.length-1;left>0;i=(i-1+counts.length)%counts.length){counts[i]++;left--;}
 const positions=[];counts.forEach((n,r)=>{for(let j=0;j<n;j++){const angle=n===1?Math.PI/2:Math.PI-j*Math.PI/(n-1);positions.push({angle,r:radii[r]});}});positions.sort((a,b)=>b.angle-a.angle||a.r-b.r);const outer=radii.at(-1),width=2*outer+35,height=outer+25;let circles='';positions.forEach((pos,i)=>{const p=all[i],cx=width/2+pos.r*Math.cos(pos.angle),cy=height-7-pos.r*Math.sin(pos.angle),opacity=!selectedParty||selectedParty===p.id?1:.18;circles+=`<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${Math.min(7.5,Math.max(1.3,(outer*2.8/Math.max(...counts))/3.3)).toFixed(2)}" fill="${p.color}" opacity="${opacity}" data-seat-party="${p.id}" tabindex="-1"><title>${esc(p.name)} · ${p.id==='pending'?total-assigned:p.seats} escaños</title></circle>`;});const p=data.parties.find(x=>x.id===selectedParty);return`<svg class="hemi" viewBox="0 0 ${width} ${height+10}" role="img" aria-label="Hemiciclo de ${total} escaños. Selecciona un partido en la leyenda para destacarlo.">${circles}</svg><div class="hemi-center"><strong>${p?p.seats:selectedParty==='pending'?total-assigned:total}</strong><span>${p?esc(p.name):selectedParty==='pending'?'escaños sin asignar':'escaños en la cámara'}</span></div><div class="legend">${data.parties.map(p=>`<button data-party-focus="${p.id}" aria-pressed="${selectedParty===p.id}" class="${selectedParty===p.id?'selected':''}"><i class="party-dot" style="background:${p.color}"></i>${esc(p.name)} <b>${p.seats}</b></button>`).join('')}${assigned<total?`<span style="font-size:9px;color:var(--wmuted)">${total-assigned} sin asignar</span>`:''}</div><div class="majority-caption">Mayoría absoluta: ${data.majority} · Pulsa un partido para destacarlo</div>`;}
function compareHTML(){const max=Math.max(1,...data.parties.flatMap(p=>[p.seats,p.previous]));return`<div class="compare-key"><span><i></i>Actuales</span><span><i style="opacity:.28"></i>Elección anterior</span><span style="margin-left:auto">Variación en escaños</span></div>${data.parties.map(p=>{const d=p.seats-p.previous;return`<div class="comparison-row"><div class="party-name"><i class="party-dot" style="background:${p.color}"></i><span title="${esc(p.name)}">${esc(p.name)}</span></div><div class="double-bar" role="img" aria-label="${esc(p.name)}: ${p.seats} actuales y ${p.previous} anteriores"><div><span style="width:${p.seats/max*100}%;background:${p.color}"></span></div><div><span style="width:${p.previous/max*100}%;background:${p.color};opacity:.3"></span></div></div><div class="delta ${d>0?'positive':d<0?'negative':''}">${d>0?'+':''}${d}</div></div>`;}).join('')}<button class="btn small" id="compareDetails" aria-expanded="false" aria-controls="compareTable" style="background:var(--wbg);color:var(--wmuted);border-color:var(--wline)">Ver cifras completas</button><div id="compareTable" class="table-scroll" hidden><table class="data-table"><thead><tr><th>Partido</th><th>Actuales</th><th>Anteriores</th><th>Variación</th></tr></thead><tbody>${data.parties.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.seats}</td><td>${p.previous}</td><td>${p.seats-p.previous>0?'+':''}${p.seats-p.previous}</td></tr>`).join('')}</tbody></table></div>`;}
function turnoutHTML(){const length=2*Math.PI*74,delta=data.turnout-data.previousTurnout;return`<div class="turnout-body"><svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Participación: ${pct(data.turnout)}. Abstención: ${pct(100-data.turnout)}"><circle cx="90" cy="90" r="74" fill="none" stroke="var(--wline)" stroke-width="19"/><circle cx="90" cy="90" r="74" fill="none" stroke="#7f9c74" stroke-width="19" stroke-dasharray="${length*data.turnout/100} ${length}" transform="rotate(-90 90 90)" stroke-linecap="round"/><text x="90" y="89" text-anchor="middle" fill="var(--wtext)" font-family="Arial" font-size="27" font-weight="700">${fmt(data.turnout,1)}%</text><text x="90" y="108" text-anchor="middle" fill="var(--wmuted)" font-family="Arial" font-size="9">PARTICIPACIÓN</text></svg><div class="turnout-info"><strong>${pct(data.turnout)}</strong><p>de participación introducida</p><span class="turnout-delta">${delta>0?'+':''}${fmt(delta,1)} puntos respecto a la anterior</span><p style="margin:16px 0 0;font-size:10px">Anterior: <b>${pct(data.previousTurnout)}</b><br>Abstención actual: <b>${pct(100-data.turnout)}</b></p></div></div><p class="pact-intro" style="font-size:9px;margin:0">Comparación válida si ambas cifras corresponden al mismo ámbito y momento de la jornada.</p>`;}
function bindWidget(mount){mount.querySelectorAll('[data-results-mode]').forEach(b=>b.onclick=()=>{resultsMode=b.dataset.resultsMode;renderWidget();});const sortEl=mount.querySelector('#resultSort');if(sortEl)sortEl.onchange=()=>{sort=sortEl.value;renderWidget();};mount.querySelectorAll('[data-pact]').forEach(b=>b.onchange=()=>{roles[b.dataset.pact]=b.checked?'yes':'no';const focusId=b.dataset.pact;renderWidget();mount.querySelector(`[data-pact="${focusId}"]`)?.focus({preventScroll:true});});mount.querySelectorAll('[data-role]').forEach(b=>b.onchange=()=>{roles[b.dataset.role]=b.value;const focusId=b.dataset.role;renderWidget();mount.querySelector(`[data-role="${focusId}"]`)?.focus({preventScroll:true});});const ruleEl=mount.querySelector('#pactRule');if(ruleEl)ruleEl.onchange=()=>{rule=ruleEl.value;renderWidget();mount.querySelector('#pactRule')?.focus({preventScroll:true});};const clear=mount.querySelector('#clearPact');if(clear)clear.onclick=()=>{roles={};renderWidget();mount.querySelector('#clearPact')?.focus({preventScroll:true});};mount.querySelectorAll('[data-party-focus],[data-seat-party]').forEach(b=>b.onclick=()=>{const id=b.dataset.partyFocus||b.dataset.seatParty;selectedParty=selectedParty===id?null:id;renderWidget();if(b.dataset.partyFocus)mount.querySelector(`[data-party-focus="${id}"]`)?.focus({preventScroll:true});});const details=mount.querySelector('#compareDetails');if(details)details.onclick=()=>{const table=mount.querySelector('#compareTable');table.hidden=!table.hidden;details.textContent=table.hidden?'Ver cifras completas':'Ocultar cifras completas';details.setAttribute('aria-expanded',String(!table.hidden));};}
function renderTools(){$('pageContent').innerHTML=`<div class="tool-grid">${tools.map(t=>`<article class="card tool-card"><div class="tool-icon">${icon(t.icon)}</div><div class="tag">${t.id==='pacts'?'EXPLORACIÓN DE MAYORÍAS':'VISUALIZACIÓN INTERACTIVA'}</div><h2>${t.title}</h2><p>${t.description}</p><button class="btn" data-choose-tool="${t.id}">Configurar herramienta ${icon('arrow')}</button></article>`).join('')}<article class="card tool-card"><div class="tool-icon">${icon('edit')}</div><div class="tag">GRÁFICOS Y REDES SOCIALES</div><h2>Estudio gráfico avanzado</h2><p>Diseña mapas importados, sondeos, cronologías y otros gráficos. Exporta imágenes en formatos de redes sociales.</p><a class="btn" href="studio/index.html">Abrir estudio gráfico ${icon('arrow')}</a></article></div>`;document.querySelectorAll('[data-choose-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.chooseTool;page='workspace';resetInteraction();render();});}
function partyRow(p,i){return`<tr><td><input type="color" data-party="${i}" data-key="color" value="${p.color}" aria-label="Color de ${esc(p.name)}"></td><td class="name-col"><input data-party="${i}" data-key="name" value="${esc(p.name)}" aria-label="Nombre del partido ${i+1}" maxlength="80"></td>${[['votes','Votos',1],['pct','Porcentaje',.01],['seats','Escaños',1],['previous','Escaños anteriores',1]].map(([k,l,step])=>`<td class="num-col"><input data-party="${i}" data-key="${k}" type="number" min="0" ${k==='pct'?'max="100"':''} step="${step}" value="${p[k]??''}" aria-label="${l} de ${esc(p.name)}"></td>`).join('')}<td><button class="delete" data-delete-party="${i}" aria-label="Eliminar ${esc(p.name)}">${icon('trash')}</button></td></tr>`;}
function renderData(){const localDate=new Date(data.updated);const localValue=C.validDate(data.updated)?new Date(localDate.getTime()-localDate.getTimezoneOffset()*60000).toISOString().slice(0,16):'';
 $('pageContent').innerHTML=`<section class="card data-card"><div class="section-head"><div><h2>Partidos, votos y escaños</h2><p style="font-size:11px;color:#89937f;margin:0">Edita cada casilla. Todas las herramientas usan estos mismos datos.</p></div><div style="display:flex;gap:7px"><button class="btn small" id="importCSV">${icon('publish')}Importar CSV</button><button class="btn small" id="exportCSV">${icon('download')}CSV</button></div></div><div class="table-scroll"><table class="data-editor"><thead><tr><th>Color</th><th>Formación</th><th>Votos</th><th>% voto</th><th>Escaños</th><th>Anterior</th><th></th></tr></thead><tbody id="partyBody">${data.parties.map(partyRow).join('')}</tbody></table></div><div class="data-card-footer"><button class="btn soft" id="addParty">${icon('plus')}Añadir partido</button><button class="btn" id="calculatePct">Calcular % desde votos</button><span id="dataTotals"></span></div></section><div class="data-panels"><section class="card"><h3>Identificación y fuente</h3><label class="field">Título de la elección<input data-setting="title" value="${esc(data.title)}" maxlength="100"></label><label class="field">Ámbito territorial<input data-setting="territory" value="${esc(data.territory)}" maxlength="100"></label><label class="field">Fuente / organismo<input data-setting="source" value="${esc(data.source)}" maxlength="300"><span class="note">Se mostrará al pie de cada pieza. Introducir una fuente no acredita que los datos sean oficiales.</span></label><label class="field">Fecha y hora de los datos<input data-setting="updated" type="datetime-local" value="${localValue}"><span class="note">Hora local del dispositivo. Se conserva el mismo instante al exportar.</span></label><label class="check-field"><input type="checkbox" data-setting="demo" ${data.demo?'checked':''}>Identificar los datos como demostración o simulación</label><p style="font-size:10px;color:#8e967e;line-height:1.8;margin:0">Si vas a trabajar con resultados reales, sustituye todos los datos de muestra e indica su fuente antes de desactivar esta opción.</p></section><section class="card"><h3>Parámetros y comprobaciones</h3><div class="field-row"><label class="field">Escaños de la cámara<input data-setting="totalSeats" type="number" min="1" max="2000" step="1" value="${data.totalSeats??''}"></label><label class="field">Mayoría absoluta<input data-setting="majority" type="number" min="1" max="2000" step="1" value="${data.majority??''}"></label></div><div class="field-row"><label class="field">Escrutado (%)<input data-setting="counted" type="number" min="0" max="100" step=".1" value="${data.counted??''}"></label><label class="field">Participación (%)<input data-setting="turnout" type="number" min="0" max="100" step=".1" value="${data.turnout??''}"></label></div><label class="field">Participación de la convocatoria anterior (%)<input data-setting="previousTurnout" type="number" min="0" max="100" step=".1" value="${data.previousTurnout??''}"></label><div class="panel-divider"></div><ul class="validation-list" id="validationList" aria-live="polite"></ul></section></div><div class="draft-notice">Los datos se guardan como borrador en este navegador. Las piezas exportadas son instantáneas: después de actualizar cifras, vuelve a exportar el HTML y reemplaza el archivo publicado en Dröma.</div>`;
 bindSettings();bindPartyInputs();updateValidation();
 $('importCSV').onclick=()=>$('csvFile').click();$('exportCSV').onclick=exportCSV;$('addParty').onclick=()=>{if(data.parties.length>=100)return toast('El proyecto admite hasta 100 formaciones.');data.parties.push({id:'p'+Date.now()+'_'+Math.random().toString(36).slice(2,8),name:'Nuevo partido '+(data.parties.length+1),short:'',color:C.colors[data.parties.length%C.colors.length],votes:0,pct:0,seats:0,previous:0});save();renderData();$('partyBody').lastElementChild.querySelector('[data-key="name"]').focus();};
 $('calculatePct').onclick=()=>{try{const values=C.percentages(data.parties);data.parties.forEach((p,i)=>p.pct=values[i]);save();renderData();toast('Porcentajes calculados sobre los votos introducidos; total 100 %.');}catch(error){toast(error.message);}};
}
function bindPartyInputs(){document.querySelectorAll('[data-party]').forEach(input=>input.oninput=()=>{data.parties[+input.dataset.party][input.dataset.key]=input.type==='number'?(input.value===''?null:Number(input.value)):input.value;save();updateValidation();});document.querySelectorAll('[data-delete-party]').forEach(b=>b.onclick=()=>{if(data.parties.length===1)return toast('Conserva al menos un partido.');const index=+b.dataset.deleteParty;if(confirm('¿Eliminar '+data.parties[index].name+' y sus cifras del proyecto?')){delete roles[data.parties[index].id];data.parties.splice(index,1);save();renderData();}});}
function updateValidation(){const {errors,warnings}=C.issues(data);if($('validationList'))$('validationList').innerHTML=[...errors,...warnings].map(s=>`<li>${esc(s)}</li>`).join('')+(!errors.length?'<li class="ok">✓ No se detectan incoherencias que impidan exportar.</li>':'');if($('dataTotals'))$('dataTotals').textContent=`${fmt(data.parties.every(p=>typeof p.seats==='number'&&Number.isFinite(p.seats))?data.parties.reduce((s,p)=>s+p.seats,0):NaN)} / ${fmt(data.totalSeats)} escaños · ${pct(data.parties.every(p=>typeof p.pct==='number'&&Number.isFinite(p.pct))?data.parties.reduce((s,p)=>s+p.pct,0):NaN)} del voto`;}
function renderPublishPage(){$('pageContent').innerHTML=`<div class="draft-notice" style="margin:0 0 20px">Cada pieza contiene una copia de los datos de tu cobertura. Puedes actualizarla reemplazando el mismo archivo HTML en Dröma: tus visitantes verán la nueva versión al cargar la página.</div>${tools.map(t=>`<article class="card publication-card"><div><h2>${icon(t.icon)} ${t.title}</h2><p>${t.description}</p><div class="chip">HTML interactivo · Iframe · Diseño responsive · Tema claro u oscuro</div></div><button class="btn primary" data-publish-tool="${t.id}">Preparar pieza ${icon('arrow')}</button></article>`).join('')}`;document.querySelectorAll('[data-publish-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.publishTool;openPublish();});}
function download(name,content,type){
 const blob=content instanceof Blob?content:new Blob([content],{type}),url=URL.createObjectURL(blob),anchor=document.createElement('a');
 anchor.href=url;anchor.download=name;anchor.className='download-retry';anchor.textContent='Descargar '+name;
 const target=document.querySelector('dialog[open] .dialog-body')||$('pageContent')||document.body;target.querySelectorAll('.download-retry').forEach(n=>n.remove());target.appendChild(anchor);
 anchor.click();setTimeout(()=>{URL.revokeObjectURL(url);anchor.remove();},120000);
}
function slug(){return data.title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||'eleccion';}
function exportCSV(){try{download(slug()+'.csv',E.csv(data),'text/csv;charset=utf-8');toast('CSV preparado. Si la descarga no comienza, pulsa su enlace.');}catch(error){toast(error.message);}}
async function copy(text,success){try{await navigator.clipboard.writeText(text);toast(success);}catch(e){const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.top='0';(document.querySelector('dialog[open] .dialog-body')||document.body).appendChild(field);field.focus();field.select();const ok=document.execCommand('copy');field.remove();toast(ok?success:'Selecciona y copia el texto del recuadro.');}}
function payload(){return{version:1,data:JSON.parse(JSON.stringify(data)),tool,theme};}
function readerURL(){const base=new URL(location.href);base.search='?view=widget';base.hash=C.encode(payload());return base.href;}
function openReader(){const {errors}=C.issues(data);if(errors.length){toast('Revisa los datos antes de abrir la vista del lector.');page='data';render();return;}window.open(readerURL(),'_blank','noopener');}
function openPublish(){const {errors}=C.issues(data);if(errors.length){toast('Hay cifras que corregir antes de preparar la pieza.');page='data';render();return;}
 const dialog=$('publishDialog');dialog.innerHTML=`<div class="dialog-body"><div class="dialog-header"><h2 id="publishTitle">Tu herramienta, lista para salir.</h2><button id="closePublish" aria-label="Cerrar">${icon('close')}</button></div><p class="dialog-description">Descarga la pieza, súbela a Dröma e insértala donde quieras. La interacción funciona en el navegador de cada lector.</p><div class="field-row"><label class="field">Herramienta<select id="exportTool" aria-label="Herramienta para exportar">${tools.map(t=>`<option value="${t.id}" ${tool===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><label class="field">Apariencia<select id="exportTheme"><option value="light" ${theme==='light'?'selected':''}>Editorial claro</option><option value="dark" ${theme==='dark'?'selected':''}>Verde nocturno</option></select></label></div><div class="draft-notice" style="margin:0 0 20px;font-size:11px"><b>1.</b> Descarga el HTML y colócalo en tu web.<br><b>2.</b> Pega aquí su dirección pública para generar el iframe.<br><b>3.</b> Copia el código en el artículo o la página.</div><label class="field">Dirección pública del HTML en Dröma<input id="publicURL" type="url" placeholder="https://tu-web.es/electa/pactos.html"><span class="note">Comprueba que esta dirección permita el acceso a tus lectores. El acceso al enlace de trabajo depende del alojamiento del editor.</span></label><label class="field">Código de inserción<textarea class="code" id="embedCode" readonly placeholder="Introduce la dirección del HTML publicado para generar el código iframe."></textarea></label><div class="dialog-actions"><button class="btn primary" id="downloadHTML">${icon('download')} Descargar HTML interactivo</button><button class="btn" id="copyIframe" disabled>${icon('copy')} Copiar iframe</button></div><div class="dialog-actions"><button class="btn small" id="viewExport">${icon('eye')} Vista del lector</button><button class="btn small" id="copyReader">${icon('link')} Copiar enlace de trabajo</button><button class="btn small" id="exportImage">${icon('download')} Resultados SVG</button></div><p class="dialog-note">${data.demo?'Esta pieza conservará la etiqueta SIMULACIÓN y la fuente de muestra. ':''}El HTML incluye los datos actuales. Para renovarlos, exporta de nuevo y reemplaza el archivo conservando su dirección. Los pactos que pruebe un visitante no modifican tus cifras ni las combinaciones de otros lectores.</p></div>`;
 $('closePublish').onclick=()=>dialog.close();$('exportTool').onchange=e=>{tool=e.target.value;save();updateEmbed();if(page==='workspace')renderWorkspace();};$('exportTheme').onchange=e=>{theme=e.target.value;save();updateEmbed();if(page==='workspace')renderWidget();};$('publicURL').oninput=updateEmbed;$('copyIframe').onclick=()=>copy($('embedCode').value,'Código iframe copiado.');$('downloadHTML').onclick=downloadHTML;$('viewExport').onclick=openReader;$('copyReader').onclick=()=>copy(readerURL(),'Enlace de trabajo copiado. Comprueba el acceso antes de compartirlo.');$('exportImage').onclick=exportSVG;updateEmbed();dialog.showModal();
}
function updateEmbed(){const input=$('publicURL');if(!input)return;
 try{$('embedCode').value=E.iframe({url:input.value,data,tool});$('copyIframe').disabled=false;input.setCustomValidity('');}
 catch(error){$('embedCode').value='';$('copyIframe').disabled=true;input.setCustomValidity(input.value?error.message:'');}
}
async function downloadHTML(){
 const button=$('downloadHTML'),snapshot=payload(),name=slug()+'-'+tool+'.html';button.disabled=true;button.textContent='Preparando pieza…';
 try{
  const files=['styles.css','core.js','exports.js','app.js'],responses=await Promise.all(files.map(p=>fetch(new URL(p,location.href),{cache:'no-cache'})));
  if(responses.some(r=>!r.ok))throw Error('No se pudieron cargar los recursos. Comprueba la conexión.');
  const [css,core,exporter,app]=await Promise.all(responses.map(r=>r.text())),html=E.buildHTML({css,core,exporter,app,...snapshot});
  download(name,html,'text/html;charset=utf-8');toast('HTML interactivo preparado. Si la descarga no comienza, pulsa su enlace.');
 }catch(error){toast('No se pudo preparar el HTML: '+error.message);}
 finally{button.disabled=false;button.innerHTML=icon('download')+' Descargar HTML interactivo';}
}
function exportSVG(){try{download(slug()+'-resultados.svg',E.svg(data,{sort,dateLabel:dateLabel(data.updated)}),'image/svg+xml');toast('Gráfico SVG preparado. Si la descarga no comienza, pulsa su enlace.');}catch(error){toast(error.message);}}
function openProject(){const dialog=$('projectDialog');dialog.innerHTML=`<div class="dialog-body"><div class="dialog-header"><h2 id="projectTitle">Tu proyecto electoral</h2><button id="closeProject" aria-label="Cerrar">${icon('close')}</button></div><p class="dialog-description">Conserva una copia de tus datos o continúa una cobertura guardada. Puedes llevar el proyecto a otro navegador o dispositivo.</p><div class="project-options"><button class="btn" id="backupProject">${icon('download')}Descargar proyecto JSON<small>Datos y configuración de la cobertura</small></button><button class="btn" id="loadProject">${icon('folder')}Abrir proyecto JSON<small>Sustituye el borrador de este navegador</small></button></div><div class="dialog-actions"><a class="btn" href="electa-droma.zip" download>${icon('download')}Descargar módulo para Dröma</a><button class="btn" id="resetDemo">${icon('refresh')}Restablecer demostración</button></div><p class="dialog-note">El módulo para Dröma incluye la aplicación completa y una guía de instalación. Tu borrador se guarda solo en este navegador; el JSON es su copia portable.</p></div>`;$('closeProject').onclick=()=>dialog.close();$('backupProject').onclick=()=>{if(C.issues(data).errors.length)return toast('Corrige los datos antes de guardar una copia portable.');download(slug()+'.electa.json',JSON.stringify(projectSnapshot(),null,2),'application/json');toast('Copia de proyecto descargada.');};$('loadProject').onclick=()=>$('importFile').click();$('resetDemo').onclick=()=>{if(confirm('¿Sustituir el borrador actual por los datos de demostración? Descarga una copia si quieres conservarlo.')){data=C.demo();resetInteraction();save();dialog.close();render();toast('Demostración restablecida.');}};dialog.showModal();}
function openHelp(){const dialog=$('projectDialog');dialog.innerHTML=`<div class="dialog-body"><div class="dialog-header"><h2 id="projectTitle">De las cifras a la historia.</h2><button id="closeHelp" aria-label="Cerrar">${icon('close')}</button></div><p class="dialog-description">Tres pasos para empezar a contar una elección con Electa.</p><ol style="padding-left:20px;font-size:13px;line-height:1.9;color:#77886b"><li style="margin-bottom:15px"><b>Introduce tus datos.</b> En Datos electorales, añade partidos, votos y escaños. Identifica la fuente y la fecha. Puedes importar un CSV con cabeceras nombre, votos, porcentaje, escanos, anteriores, color.</li><li style="margin-bottom:15px"><b>Elige cómo contarlos.</b> Prueba las herramientas en la mesa de trabajo y revisa la vista de móvil. El lector puede explorar resultados, pactos y comparativas.</li><li><b>Llévalos a tu web.</b> Descarga el HTML interactivo, súbelo a Dröma y genera el iframe usando su dirección pública. Actualiza la pieza reemplazando ese mismo HTML.</li></ol><div class="draft-notice">La calculadora no cambia tus resultados. Cada visitante hace sus propias combinaciones. El editor trabaja con borradores locales, sin acceso a fuentes oficiales ni sincronización automática entre dispositivos.</div><div class="dialog-actions"><button class="btn primary" id="helpStart">Editar mis datos ${icon('arrow')}</button></div></div>`;$('closeHelp').onclick=()=>dialog.close();$('helpStart').onclick=()=>{dialog.close();page='data';render();};dialog.showModal();}
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('El archivo supera los 2 MB.');const raw=JSON.parse(await f.text()),next=C.normalize(raw);if(confirm('¿Abrir este proyecto y sustituir el borrador actual?')){data=next;resetInteraction();restoreUI(raw._electaUI);save();$('projectDialog').close();render();toast('Proyecto abierto.');}}catch(error){toast('No se pudo importar: '+error.message);}finally{e.target.value='';}};
$('csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('El CSV supera los 2 MB.');const parties=C.parseCSV(await f.text()),next=C.normalize({...data,parties});if(confirm('¿Sustituir la lista actual de partidos por los del CSV?')){data=next;resetInteraction();save();renderData();toast('CSV importado. Revisa la fuente y la identificación de los datos.');}}catch(error){toast('No se pudo importar: '+error.message);}finally{e.target.value='';}};
for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});
window.addEventListener('pagehide',flushSave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();});window.addEventListener('storage',e=>{if(e.key==='electa-droma-project-v1')toast('El proyecto ha cambiado en otra pestaña. Descarga una copia antes de continuar editando.');});
render();
window.Electa={getData:()=>JSON.parse(JSON.stringify(data)),getTool:()=>tool};
})();
</script></body></html>
