function resultsHTML(){const parties=sorted(),max=Math.max(...parties.map(p=>p.pct),1);return`<div class="widget-tabs"><button data-results-mode="chart" class="${resultsMode==='chart'?'active':''}" aria-pressed="${resultsMode==='chart'}">Gráfico</button><button data-results-mode="table" class="${resultsMode==='table'?'active':''}" aria-pressed="${resultsMode==='table'}">Tabla de datos</button><label style="margin-left:auto;font-size:9px;color:var(--wmuted)">Ordenar <select id="resultSort" aria-label="Ordenar resultados" style="border:0;background:var(--wbg);color:var(--wtext);font-size:9px;padding:5px"><option value="seats" ${sort==='seats'?'selected':''}>Por escaños</option><option value="pct" ${sort==='pct'?'selected':''}>Por voto</option><option value="name" ${sort==='name'?'selected':''}>Por nombre</option></select></label></div>${resultsMode==='table'?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Partido</th><th>Votos</th><th>% voto</th><th>Escaños</th></tr></thead><tbody>${parties.map(p=>`<tr><td><span class="party-name"><i class="party-dot" style="background:${p.color}"></i>${esc(p.name)}</span></td><td>${fmt(p.votes)}</td><td>${pct(p.pct)}</td><td>${fmt(p.seats)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="results-labels"><span>FORMACIÓN</span><span></span><span>% VOTO</span><span>ESC.</span></div>${parties.map(p=>`<div class="result-row"><div class="party-name"><i class="party-dot" style="background:${p.color}"></i><span title="${esc(p.name)}">${esc(p.name)}</span></div><div class="bar-track" role="img" aria-label="${esc(p.name)}: ${pct(p.pct)}, ${p.seats} escaños"><div class="bar-fill" style="width:${p.pct/max*100}%;background:${p.color}"></div></div><strong>${fmt(p.pct,1)}<span style="font-weight:400;font-size:8px">%</span></strong><div class="seat-count">${p.seats}</div></div>`).join('')}`}`;}
function pactsHTML(){const m=C.coalition(data,roles,rule);return`<p class="pact-intro">${rule==='simple'?'Asigna votos a favor, en contra y abstenciones para explorar una votación.':'Selecciona los partidos que sumarías a tu pacto. Prueba, combina y descubre las mayorías.'}</p><div class="pact-layout"><div class="pact-list ${rule==='simple'?'simple-list':''}">${data.parties.map(p=>rule==='simple'?`<div class="pact-row"><i class="party-dot" style="background:${p.color}"></i><span>${esc(p.name)}</span><strong>${p.seats}</strong><select data-role="${p.id}" aria-label="Posición de ${esc(p.name)}"><option value="no" ${!roles[p.id]||roles[p.id]==='no'?'selected':''}>En contra</option><option value="yes" ${roles[p.id]==='yes'?'selected':''}>A favor</option><option value="abstain" ${roles[p.id]==='abstain'?'selected':''}>Abstención</option></select></div>`:`<label class="pact-row ${roles[p.id]==='yes'?'checked':''}"><input type="checkbox" data-pact="${p.id}" ${roles[p.id]==='yes'?'checked':''}><i class="party-dot" style="background:${p.color}"></i><span>${esc(p.name)}</span><strong>${p.seats}</strong></label>`).join('')}</div><div class="pact-summary" role="status" aria-live="polite"><div class="pact-number">${m.yes}<small> / ${rule==='simple'?data.totalSeats:data.majority}</small></div><p>${rule==='simple'?`${m.no} en contra · ${m.abstain} abstenciones`:'escaños a favor del pacto'}</p><div class="pact-message ${m.passed?'success':''}">${m.passed?(m.provisional?(rule==='simple'?'Más síes que noes · Reparto provisional':'Mayoría absoluta · Reparto provisional'):rule==='simple'?'Más síes que noes':'Mayoría absoluta alcanzada'):rule==='simple'?(m.yes===m.no?'Empate: no se alcanza mayoría':'Los síes no superan a los noes'):`Faltan ${m.missing} escaños para la mayoría`}</div></div></div><div class="pact-bar" role="img" aria-label="${m.yes} escaños favorables de ${data.totalSeats}">${data.parties.filter(p=>roles[p.id]==='yes').map(p=>`<span style="width:${p.seats/data.totalSeats*100}%;background:${p.color}"></span>`).join('')}${rule==='absolute'?`<i class="majority-line" style="left:${data.majority/data.totalSeats*100}%"></i>`:''}</div><div class="majority-caption">${rule==='absolute'?`↑ Mayoría absoluta: ${data.majority} escaños`:`Síes: ${m.yes} · Noes: ${m.no} · Abstenciones: ${m.abstain}`}</div><div class="pact-tools"><select id="pactRule" aria-label="Regla de mayoría"><option value="absolute" ${rule==='absolute'?'selected':''}>Mayoría absoluta</option><option value="simple" ${rule==='simple'?'selected':''}>Mayoría simple · Síes frente a noes</option></select><button id="clearPact">Limpiar combinación</button></div>${m.pending?`<p class="pact-intro" style="margin:12px 0 0;font-size:9px">Reparto provisional: quedan ${m.pending} escaños sin asignar. ${rule==='simple'?'La comparación puede cambiar con los escaños pendientes.':''}</p>`:''}<p style="font-size:8px;color:var(--wmuted);line-height:1.7;margin:12px 0 0">Simulación aritmética. No implica acuerdos entre partidos. Las reglas de cada votación dependen del procedimiento y la jurisdicción.</p>`;}
function hemiHTML(){const total=data.totalSeats,assigned=data.parties.reduce((s,p)=>s+p.seats,0),all=[];for(const p of data.parties)for(let j=0;j<p.seats;j++)all.push(p);for(let j=assigned;j<total;j++)all.push({id:'pending',name:'Sin asignar',color:'#536044'});
 const rows=Math.max(3,Math.ceil(Math.sqrt(total)/2.7)),radii=Array.from({length:rows},(_,i)=>86+i*22),weight=radii.reduce((s,r)=>s+r,0);let counts=radii.map(r=>Math.floor(total*r/weight));let left=total-counts.reduce((s,n)=>s+n,0);for(let i=counts.length-1;left>0;i=(i-1+counts.length)%counts.length){counts[i]++;left--;}
 const positions=[];counts.forEach((n,r)=>{for(let j=0;j<n;j++){const angle=n===1?Math.PI/2:Math.PI-j*Math.PI/(n-1);positions.push({angle,r:radii[r]});}});positions.sort((a,b)=>b.angle-a.angle||a.r-b.r);const outer=radii.at(-1),width=2*outer+35,height=outer+25;let circles='';positions.forEach((pos,i)=>{const p=all[i],cx=width/2+pos.r*Math.cos(pos.angle),cy=height-7-pos.r*Math.sin(pos.angle),opacity=!selectedParty||selectedParty===p.id?1:.18;circles+=`<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${Math.min(7.5,Math.max(1.3,(outer*2.8/Math.max(...counts))/3.3)).toFixed(2)}" fill="${p.color}" opacity="${opacity}" data-seat-party="${p.id}" tabindex="-1"><title>${esc(p.name)} · ${p.id==='pending'?total-assigned:p.seats} escaños</title></circle>`;});const p=data.parties.find(x=>x.id===selectedParty);return`<svg class="hemi" viewBox="0 0 ${width} ${height+10}" role="img" aria-label="Hemiciclo de ${total} escaños. Selecciona un partido en la leyenda para destacarlo.">${circles}</svg><div class="hemi-center"><strong>${p?p.seats:selectedParty==='pending'?total-assigned:total}</strong><span>${p?esc(p.name):selectedParty==='pending'?'escaños sin asignar':'escaños en la cámara'}</span></div><div class="legend">${data.parties.map(p=>`<button data-party-focus="${p.id}" aria-pressed="${selectedParty===p.id}" class="${selectedParty===p.id?'selected':''}"><i class="party-dot" style="background:${p.color}"></i>${esc(p.name)} <b>${p.seats}</b></button>`).join('')}${assigned<total?`<span style="font-size:9px;color:var(--wmuted)">${total-assigned} sin asignar</span>`:''}</div><div class="majority-caption">Mayoría absoluta: ${data.majority} · Pulsa un partido para destacarlo</div>`;}
function compareHTML(){const max=Math.max(1,...data.parties.flatMap(p=>[p.seats,p.previous]));return`<div class="compare-key"><span><i></i>Actuales</span><span><i style="opacity:.28"></i>Elección anterior</span><span style="margin-left:auto">Variación en escaños</span></div>${data.parties.map(p=>{const d=p.seats-p.previous;return`<div class="comparison-row"><div class="party-name"><i class="party-dot" style="background:${p.color}"></i><span title="${esc(p.name)}">${esc(p.name)}</span></div><div class="double-bar" role="img" aria-label="${esc(p.name)}: ${p.seats} actuales y ${p.previous} anteriores"><div><span style="width:${p.seats/max*100}%;background:${p.color}"></span></div><div><span style="width:${p.previous/max*100}%;background:${p.color};opacity:.3"></span></div></div><div class="delta ${d>0?'positive':d<0?'negative':''}">${d>0?'+':''}${d}</div></div>`;}).join('')}<button class="btn small" id="compareDetails" aria-expanded="false" aria-controls="compareTable" style="background:var(--wbg);color:var(--wmuted);border-color:var(--wline)">Ver cifras completas</button><div id="compareTable" class="table-scroll" hidden><table class="data-table"><thead><tr><th>Partido</th><th>Actuales</th><th>Anteriores</th><th>Variación</th></tr></thead><tbody>${data.parties.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.seats}</td><td>${p.previous}</td><td>${p.seats-p.previous>0?'+':''}${p.seats-p.previous}</td></tr>`).join('')}</tbody></table></div>`;}
function turnoutHTML(){const length=2*Math.PI*74,delta=data.turnout-data.previousTurnout;return`<div class="turnout-body"><svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Participación: ${pct(data.turnout)}. Abstención: ${pct(100-data.turnout)}"><circle cx="90" cy="90" r="74" fill="none" stroke="var(--wline)" stroke-width="19"/><circle cx="90" cy="90" r="74" fill="none" stroke="#d9ff62" stroke-width="19" stroke-dasharray="${length*data.turnout/100} ${length}" transform="rotate(-90 90 90)" stroke-linecap="round"/><text x="90" y="89" text-anchor="middle" fill="var(--wtext)" font-family="Arial" font-size="27" font-weight="700">${fmt(data.turnout,1)}%</text><text x="90" y="108" text-anchor="middle" fill="var(--wmuted)" font-family="Arial" font-size="9">PARTICIPACIÓN</text></svg><div class="turnout-info"><strong>${pct(data.turnout)}</strong><p>de participación introducida</p><span class="turnout-delta">${delta>0?'+':''}${fmt(delta,1)} puntos respecto a la anterior</span><p style="margin:16px 0 0;font-size:10px">Anterior: <b>${pct(data.previousTurnout)}</b><br>Abstención actual: <b>${pct(100-data.turnout)}</b></p></div></div><p class="pact-intro" style="font-size:9px;margin:0">Comparación válida si ambas cifras corresponden al mismo ámbito y momento de la jornada.</p>`;}
function bindWidget(mount){mount.querySelectorAll('[data-results-mode]').forEach(b=>b.onclick=()=>{resultsMode=b.dataset.resultsMode;renderWidget();});const sortEl=mount.querySelector('#resultSort');if(sortEl)sortEl.onchange=()=>{sort=sortEl.value;renderWidget();};mount.querySelectorAll('[data-pact]').forEach(b=>b.onchange=()=>{roles[b.dataset.pact]=b.checked?'yes':'no';const focusId=b.dataset.pact;renderWidget();mount.querySelector(`[data-pact="${focusId}"]`)?.focus({preventScroll:true});});mount.querySelectorAll('[data-role]').forEach(b=>b.onchange=()=>{roles[b.dataset.role]=b.value;const focusId=b.dataset.role;renderWidget();mount.querySelector(`[data-role="${focusId}"]`)?.focus({preventScroll:true});});const ruleEl=mount.querySelector('#pactRule');if(ruleEl)ruleEl.onchange=()=>{rule=ruleEl.value;renderWidget();mount.querySelector('#pactRule')?.focus({preventScroll:true});};const clear=mount.querySelector('#clearPact');if(clear)clear.onclick=()=>{roles={};renderWidget();mount.querySelector('#clearPact')?.focus({preventScroll:true});};mount.querySelectorAll('[data-party-focus],[data-seat-party]').forEach(b=>b.onclick=()=>{const id=b.dataset.partyFocus||b.dataset.seatParty;selectedParty=selectedParty===id?null:id;renderWidget();if(b.dataset.partyFocus)mount.querySelector(`[data-party-focus="${id}"]`)?.focus({preventScroll:true});});const details=mount.querySelector('#compareDetails');if(details)details.onclick=()=>{const table=mount.querySelector('#compareTable');table.hidden=!table.hidden;details.textContent=table.hidden?'Ver cifras completas':'Ocultar cifras completas';details.setAttribute('aria-expanded',String(!table.hidden));};}
function renderTools(){$('pageContent').innerHTML=`<div class="tool-grid">${tools.map(t=>`<article class="card tool-card"><div class="tool-icon">${icon(t.icon)}</div><div class="tag">${t.id==='pacts'?'EXPLORACIÓN DE MAYORÍAS':'VISUALIZACIÓN INTERACTIVA'}</div><h2>${t.title}</h2><p>${t.description}</p><button class="btn" data-choose-tool="${t.id}">Configurar herramienta ${icon('arrow')}</button></article>`).join('')}<article class="card tool-card"><div class="tool-icon">${icon('edit')}</div><div class="tag">GRÁFICOS Y REDES SOCIALES</div><h2>Estudio gráfico avanzado</h2><p>Diseña mapas importados, sondeos, cronologías y otros gráficos. Exporta imágenes en formatos de redes sociales.</p><a class="btn" data-advanced-link href="studio/index.html?v=1.3.0">Abrir estudio gráfico ${icon('arrow')}</a></article></div>`;document.querySelectorAll('[data-advanced-link]').forEach(link=>link.onclick=e=>{if(window.ELECTA_ADVANCED_HTML){e.preventDefault();openAdvanced();}});document.querySelectorAll('[data-choose-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.chooseTool;page='workspace';resetInteraction();render();});}
function partyRow(p,i){return`<tr><td><input type="color" data-party="${i}" data-key="color" value="${p.color}" aria-label="Color de ${esc(p.name)}"></td><td class="name-col"><input data-party="${i}" data-key="name" value="${esc(p.name)}" aria-label="Nombre del partido ${i+1}" maxlength="80"></td>${[['votes','Votos',1],['pct','Porcentaje',.01],['seats','Escaños',1],['previous','Escaños anteriores',1]].map(([k,l,step])=>`<td class="num-col"><input data-party="${i}" data-key="${k}" type="number" min="0" ${k==='pct'?'max="100"':''} step="${step}" value="${p[k]??''}" aria-label="${l} de ${esc(p.name)}"></td>`).join('')}<td><button class="delete" data-delete-party="${i}" aria-label="Eliminar ${esc(p.name)}">${icon('trash')}</button></td></tr>`;}
function renderData(){const localDate=new Date(data.updated);const localValue=C.validDate(data.updated)?new Date(localDate.getTime()-localDate.getTimezoneOffset()*60000).toISOString().slice(0,16):'';
 $('pageContent').innerHTML=`<section class="card data-card"><div class="section-head"><div><h2>Partidos, votos y escaños</h2><p style="font-size:11px;color:var(--muted);margin:0">Edita cada casilla. Todas las herramientas usan estos mismos datos.</p></div><div style="display:flex;gap:7px"><button class="btn small" id="importCSV">${icon('publish')}Importar CSV</button><button class="btn small" id="exportCSV">${icon('download')}CSV</button></div></div><div class="table-scroll"><table class="data-editor"><thead><tr><th>Color</th><th>Formación</th><th>Votos</th><th>% voto</th><th>Escaños</th><th>Anterior</th><th></th></tr></thead><tbody id="partyBody">${data.parties.map(partyRow).join('')}</tbody></table></div><div class="data-card-footer"><button class="btn soft" id="addParty">${icon('plus')}Añadir partido</button><button class="btn" id="calculatePct">Calcular % desde votos</button><span id="dataTotals"></span></div></section><div class="data-panels"><section class="card"><h3>Identificación y fuente</h3><label class="field">Título de la elección<input data-setting="title" value="${esc(data.title)}" maxlength="100"></label><label class="field">Ámbito territorial<input data-setting="territory" value="${esc(data.territory)}" maxlength="100"></label><label class="field">Fuente / organismo<input data-setting="source" value="${esc(data.source)}" maxlength="300"><span class="note">Se mostrará al pie de cada pieza. Introducir una fuente no acredita que los datos sean oficiales.</span></label><label class="field">Fecha y hora de los datos<input data-setting="updated" type="datetime-local" value="${localValue}"><span class="note">Hora local del dispositivo. Se conserva el mismo instante al exportar.</span></label><label class="check-field"><input type="checkbox" data-setting="demo" ${data.demo?'checked':''}>Identificar los datos como demostración o simulación</label><p style="font-size:10px;color:var(--muted);line-height:1.8;margin:0">Si vas a trabajar con resultados reales, sustituye todos los datos de muestra e indica su fuente antes de desactivar esta opción.</p></section><section class="card"><h3>Parámetros y comprobaciones</h3><div class="field-row"><label class="field">Escaños de la cámara<input data-setting="totalSeats" type="number" min="1" max="2000" step="1" value="${data.totalSeats??''}"></label><label class="field">Mayoría absoluta<input data-setting="majority" type="number" min="1" max="2000" step="1" value="${data.majority??''}"></label></div><div class="field-row"><label class="field">Escrutado (%)<input data-setting="counted" type="number" min="0" max="100" step=".1" value="${data.counted??''}"></label><label class="field">Participación (%)<input data-setting="turnout" type="number" min="0" max="100" step=".1" value="${data.turnout??''}"></label></div><label class="field">Participación de la convocatoria anterior (%)<input data-setting="previousTurnout" type="number" min="0" max="100" step=".1" value="${data.previousTurnout??''}"></label><div class="panel-divider"></div><ul class="validation-list" id="validationList" aria-live="polite"></ul></section></div><div class="draft-notice">Los datos se guardan como borrador en este navegador. Las piezas exportadas son instantáneas: después de actualizar cifras, vuelve a exportar el HTML y reemplaza el archivo publicado en Dröma.</div>`;
 bindSettings();bindPartyInputs();updateValidation();
 $('importCSV').onclick=()=>$('csvFile').click();$('exportCSV').onclick=exportCSV;$('addParty').onclick=()=>{if(data.parties.length>=100)return toast('El proyecto admite hasta 100 formaciones.');data.parties.push({id:'p'+Date.now()+'_'+Math.random().toString(36).slice(2,8),name:'Nuevo partido '+(data.parties.length+1),short:'',color:C.colors[data.parties.length%C.colors.length],votes:0,pct:0,seats:0,previous:0});save();renderData();$('partyBody').lastElementChild.querySelector('[data-key="name"]').focus();};
 $('calculatePct').onclick=()=>{try{const values=C.percentages(data.parties);data.parties.forEach((p,i)=>p.pct=values[i]);save();renderData();toast('Porcentajes calculados sobre los votos introducidos; total 100 %.');}catch(error){toast(error.message);}};
}
function bindPartyInputs(){document.querySelectorAll('[data-party]').forEach(input=>input.oninput=()=>{data.parties[+input.dataset.party][input.dataset.key]=input.type==='number'?(input.value===''?null:Number(input.value)):input.value;save();updateValidation();});document.querySelectorAll('[data-delete-party]').forEach(b=>b.onclick=()=>{if(data.parties.length===1)return toast('Conserva al menos un partido.');const index=+b.dataset.deleteParty;if(confirm('¿Eliminar '+data.parties[index].name+' y sus cifras del proyecto?')){delete roles[data.parties[index].id];data.parties.splice(index,1);save();renderData();}});}
function updateValidation(){const {errors,warnings}=C.issues(data);if($('validationList'))$('validationList').innerHTML=[...errors,...warnings].map(s=>`<li>${esc(s)}</li>`).join('')+(!errors.length?'<li class="ok">✓ No se detectan incoherencias que impidan exportar.</li>':'');if($('dataTotals'))$('dataTotals').textContent=`${fmt(data.parties.every(p=>typeof p.seats==='number'&&Number.isFinite(p.seats))?data.parties.reduce((s,p)=>s+p.seats,0):NaN)} / ${fmt(data.totalSeats)} escaños · ${pct(data.parties.every(p=>typeof p.pct==='number'&&Number.isFinite(p.pct))?data.parties.reduce((s,p)=>s+p.pct,0):NaN)} del voto`;}
function renderPublishPage(){$('pageContent').innerHTML=`<div class="insert-intro"><div class="eyebrow">DE ELECTA A TU PÁGINA</div><h2>Elige una pieza. Copia. Pega.</h2><p>Obtén un bloque de código con la herramienta y tus datos. Pégalo en un bloque «HTML personalizado» de tu web. También puedes descargar un archivo para subirlo a tu alojamiento.</p></div>${tools.map(t=>`<article class="card publication-card"><div><h2>${icon(t.icon)} ${t.title}</h2><p>${t.description}</p><div class="chip">Interactiva · Responsive · Estética Dröma</div></div><button class="btn primary" data-publish-tool="${t.id}">Poner en mi web ${icon('arrow')}</button></article>`).join('')}`;document.querySelectorAll('[data-publish-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.publishTool;resetInteraction();save();openPublish();});}
function download(name,content,type){
 const blob=content instanceof Blob?content:new Blob([content],{type}),url=URL.createObjectURL(blob),anchor=document.createElement('a');
 anchor.href=url;anchor.download=name;anchor.className='download-retry';anchor.textContent='Descargar '+name;
 const target=document.querySelector('dialog[open] .dialog-body')||$('pageContent')||document.body;target.querySelectorAll('.download-retry').forEach(n=>n.remove());target.appendChild(anchor);
 anchor.click();setTimeout(()=>{URL.revokeObjectURL(url);anchor.remove();},120000);
}
function slug(){return data.title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||'eleccion';}
function exportCSV(){try{download(slug()+'.csv',E.csv(data),'text/csv;charset=utf-8');toast('CSV preparado. Si la descarga no comienza, pulsa su enlace.');}catch(error){toast(error.message);}}
async function copy(text,success){
 try{if(!navigator.clipboard?.writeText)throw Error('Portapapeles no disponible');await navigator.clipboard.writeText(text);toast(success);return true;}
 catch(error){const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.top='0';const active=document.activeElement;(document.querySelector('dialog[open] .dialog-body')||document.body).appendChild(field);field.focus();field.select();let ok=false;try{ok=document.execCommand('copy');}catch{}field.remove();active?.focus({preventScroll:true});toast(ok?success:'Abre «Ver código y opciones», pulsa «Seleccionar código» y cópialo con el menú de tu dispositivo.');return ok;}
}
function payload(){return{version:1,data:JSON.parse(JSON.stringify(data)),tool,theme};}
function readerURL(){const base=new URL(location.href);base.search='?view=widget';base.hash=C.encode(payload());return base.href;}
function openReader(){const {errors}=C.issues(data);if(errors.length){toast('Revisa los datos antes de abrir la vista del lector.');page='data';render();return;}window.open(readerURL(),'_blank','noopener');}
function openPublish(){const {errors}=C.issues(data);if(errors.length){page='data';render();toast('Revisa las cifras señaladas antes de preparar la pieza.');return;}
 const dialog=$('publishDialog');publishSession={revision:0,html:'',snapshot:null};dialog.classList.add('insert-dialog');
 dialog.innerHTML=`<div class="dialog-body"><div class="dialog-header"><div><div class="eyebrow">PUBLICACIÓN · ELECTA BY DRÖMA</div><h2 id="publishTitle">Pon esta herramienta en tu web.</h2></div><button id="closePublish" aria-label="Cerrar">${icon('close')}</button></div><p class="dialog-description">Elige la pieza, comprueba la vista previa y llévala a tu página.</p><div class="insert-layout"><section class="insert-settings" aria-label="Opciones de inserción"><div class="insert-step"><span>1</span><h3>Elige lo que verá tu audiencia</h3></div><div class="field-row"><label class="field">Herramienta<select id="exportTool">${tools.map(t=>`<option value="${t.id}" ${tool===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><label class="field">Apariencia<select id="exportTheme"><option value="dark" ${theme==='dark'?'selected':''}>Dröma · negro y lima</option><option value="light" ${theme==='light'?'selected':''}>Editorial claro</option></select></label></div><div class="insert-step"><span>2</span><h3>Cómo quieres colocarla</h3></div><div class="insert-methods" role="group" aria-label="Método de inserción"><button class="insert-method" id="methodInline" aria-pressed="${publishMethod==='inline'}">${icon('copy')}<span><b>Copiar y pegar</b><small>Sin subir archivos</small></span><em>FÁCIL</em></button><button class="insert-method" id="methodFile" aria-pressed="${publishMethod==='file'}">${icon('file')}<span><b>Subir un archivo</b><small>Usar su dirección pública</small></span></button></div><div id="inlineInstructions" class="insert-instructions"><p>Pega el código completo en un bloque <b>«HTML personalizado»</b> de tu página y guarda los cambios.</p><p class="note">Tu editor debe admitir iframes con contenido HTML y scripts. Si elimina el código o bloquea la pieza, utiliza «Subir un archivo».</p></div><div id="fileInstructions" class="insert-instructions" hidden><p><b>A. Descarga y sube el HTML</b> a una carpeta pública de tu web. No necesita otros archivos.</p><button class="btn" id="downloadHTML" disabled>${icon('download')} Descargar HTML interactivo</button><small class="insert-filename" id="exportFilename"></small><label class="field">B. Pega la dirección del archivo publicado<input id="publicURL" type="url" placeholder="https://tu-web.es/electa/pactos.html" aria-describedby="publicURLNote urlError"><span class="note" id="publicURLNote">Debe abrir directamente la herramienta y permitir el acceso a tus lectores.</span><span class="insert-error" id="urlError" aria-live="polite"></span></label><a id="checkPublicURL" class="btn small" target="_blank" rel="noopener noreferrer" hidden>Comprobar archivo publicado ${icon('arrow')}</a><p class="note">C. Copia el código de abajo y pégalo en el bloque HTML de tu página. Si tu gestor solo admite una URL, utiliza esta dirección en su bloque iframe.</p></div><div class="insert-status" id="publishStatus" role="status" aria-live="polite">Preparando la herramienta…</div><button class="btn small" id="retryExport" hidden>Volver a preparar</button><button class="btn primary insert-copy" id="copyIframe" disabled>${icon('copy')} Copiar código para mi web</button><details id="codeDetails" class="insert-code"><summary>Ver código y opciones</summary><label class="check-field insert-resize"><input id="autoResize" type="checkbox" checked>Adaptar la altura al contenido <span class="note">Recomendado</span></label><p class="note" id="resizeNote">Incluye un pequeño script para evitar recortes al interactuar o cambiar el ancho.</p><label class="field" for="embedCode">Código completo de inserción</label><textarea class="code" id="embedCode" readonly spellcheck="false" aria-label="Código completo de inserción"></textarea><div class="dialog-actions"><button class="btn small" id="selectEmbed" disabled>Seleccionar código</button><button class="btn small" id="downloadEmbed" disabled>${icon('download')}Guardar código en TXT</button></div></details><details class="insert-help"><summary>¿Cómo actualizo los datos?</summary><p>Modifica las cifras en Electa y vuelve a exportar. Con «Copiar y pegar», sustituye el bloque completo de tu página. Con «Subir un archivo», reemplaza el HTML manteniendo su dirección. Los datos no se actualizan solos.</p></details></section><aside class="insert-preview"><div class="insert-preview-header"><div><span class="live-dot"></span> VISTA DEL LECTOR</div><div class="device-switch"><button id="exportDesktop" class="active" aria-label="Previsualizar en escritorio" aria-pressed="true">${icon('monitor')}</button><button id="exportMobile" aria-label="Previsualizar en móvil" aria-pressed="false">${icon('mobile')}</button></div></div><div class="insert-frame-wrap" id="exportFrameWrap"><iframe id="exportPreview" title="Vista previa de la herramienta exportada" sandbox="allow-scripts"></iframe></div><p class="insert-preview-note">${icon('check')} Esta vista utiliza el mismo HTML que se exporta. Prueba sus botones y opciones.</p><div class="insert-data-note">${data.demo?'<b>Datos de demostración.</b> La etiqueta SIMULACIÓN se conservará en la pieza.':'Se incluyen las cifras, la fuente y la fecha de tu cobertura.'} Las combinaciones de cada lector son independientes.</div><details class="insert-help"><summary>Otros archivos</summary><div class="dialog-actions"><button class="btn small" id="downloadAlternativeHTML" disabled>${icon('download')}HTML interactivo</button><button class="btn small" id="exportImage" ${tool==='results'?'':'hidden'}>${icon('download')}Imagen fija de resultados · SVG</button></div><p class="note">El HTML mantiene la interacción. El SVG es una imagen estática de los resultados.</p></details></aside></div></div>`;
 $('closePublish').onclick=()=>dialog.close();
 dialog.onclose=()=>{publishSession=null;$('exportPreview')?.removeAttribute('srcdoc');};
 $('exportTool').onchange=e=>{tool=e.target.value;resetInteraction();save();$('publicURL').value=publicationURLs[tool]||'';if(page==='workspace')renderWorkspace();preparePublication();};
 $('exportTheme').onchange=e=>{theme=e.target.value;save();if(page==='workspace')renderWidget();preparePublication();};
 $('methodInline').onclick=()=>{publishMethod='inline';updateEmbed();};$('methodFile').onclick=()=>{publishMethod='file';updateEmbed();};
 $('publicURL').value=publicationURLs[tool]||'';$('publicURL').oninput=()=>{publicationURLs[tool]=$('publicURL').value;updateEmbed();};$('autoResize').onchange=updateEmbed;
 $('copyIframe').onclick=async()=>{const value=$('embedCode').value;if(!value)return;const ok=await copy(value,'Código copiado. Pégalo completo en el bloque HTML de tu web.');if(!ok){$('codeDetails').open=true;$('embedCode').focus();$('embedCode').select();}};
 $('selectEmbed').onclick=()=>{$('embedCode').focus();$('embedCode').select();toast('Código seleccionado. Usa Copiar en el menú de tu dispositivo o Ctrl/Cmd + C.');};
 $('downloadEmbed').onclick=()=>{if(!$('embedCode').value)return;download(slug()+'-'+tool+'-insertar.txt',$('embedCode').value,'text/plain;charset=utf-8');toast('Código preparado en TXT. Pega todo su contenido en el bloque HTML de tu web.');};
 $('downloadHTML').onclick=downloadHTML;$('downloadAlternativeHTML').onclick=downloadHTML;$('exportImage').onclick=exportSVG;$('retryExport').onclick=preparePublication;
 for(const [id,mobile]of [['exportDesktop',false],['exportMobile',true]])$(id).onclick=()=>{$('exportFrameWrap').classList.toggle('mobile',mobile);$('exportDesktop').classList.toggle('active',!mobile);$('exportDesktop').setAttribute('aria-pressed',String(!mobile));$('exportMobile').classList.toggle('active',mobile);$('exportMobile').setAttribute('aria-pressed',String(mobile));};
 dialog.showModal();preparePublication();
}
async function exportResources(){
 if(typeof window.ELECTA_LOCAL_SOURCES==='function')return window.ELECTA_LOCAL_SOURCES();
 if(!resourcePromise)resourcePromise=(async()=>{
  const files=['styles.css','core.js','exports.js','app.js'],responses=await Promise.all(files.map(p=>{const url=new URL(p,location.href);url.search='?v=1.3.0';url.hash='';return fetch(url,{cache:'no-cache'});}));
  if(responses.some(r=>!r.ok))throw Error('No se han podido cargar los recursos. Comprueba tu conexión y vuelve a preparar la pieza.');
  const [css,core,exporter,app]=await Promise.all(responses.map(r=>r.text()));return{css,core,exporter,app};
 })().catch(error=>{resourcePromise=null;throw error;});
 return resourcePromise;
}
async function preparePublication(){
 const session=publishSession;if(!session)return;const revision=++session.revision,snapshot=payload();session.html='';session.error='';session.snapshot=snapshot;
 $('publishDialog').querySelectorAll('.dialog-status,.download-retry').forEach(node=>node.remove());
 $('exportFilename').textContent=slug()+'-'+tool+'.html';$('exportImage').hidden=tool!=='results';$('retryExport').hidden=true;$('exportPreview').removeAttribute('srcdoc');updateEmbed();
 try{const resources=await exportResources(),html=E.buildHTML({...resources,...snapshot});if(publishSession!==session||session.revision!==revision)return;session.html=html;$('exportPreview').srcdoc=html;updateEmbed();}
 catch(error){if(publishSession!==session||session.revision!==revision)return;session.error=error.message;$('retryExport').hidden=false;updateEmbed();}
}
function updateEmbed(){
 const session=publishSession;if(!session||!$('embedCode'))return;const inline=publishMethod==='inline';
 $('methodInline').setAttribute('aria-pressed',String(inline));$('methodFile').setAttribute('aria-pressed',String(!inline));$('inlineInstructions').hidden=!inline;$('fileInstructions').hidden=inline;
 $('urlError').textContent='';$('publicURL').removeAttribute('aria-invalid');$('embedCode').value='';$('checkPublicURL').hidden=true;$('checkPublicURL').removeAttribute('href');
 const ready=!!session.html;for(const id of ['downloadHTML','downloadAlternativeHTML'])$(id).disabled=!ready;
 let code='',status=session.error||'Preparando la herramienta…',error=!!session.error;
 if(ready){
  try{if(!inline&&!$('publicURL').value.trim())status='Descarga el HTML, súbelo y pega su dirección para obtener el código.';
   else{if(!inline){$('checkPublicURL').href=E.publicURL($('publicURL').value);$('checkPublicURL').hidden=false;}code=E.iframe({...(inline?{html:session.html}:{url:$('publicURL').value}),data:session.snapshot.data,tool:session.snapshot.tool,autoResize:$('autoResize').checked});status=inline?'Listo para pegar · Incluye la herramienta, los datos y el diseño Dröma.':'Código preparado · Comprueba que la dirección abra la pieza publicada.';}}
  catch(e){error=true;status='Revisa la dirección del archivo para continuar.';$('urlError').textContent='Usa una dirección completa que empiece por https:// o http://.';$('publicURL').setAttribute('aria-invalid','true');}
 }
 $('resizeNote').textContent=$('autoResize').checked?'Incluye un pequeño script para evitar recortes al interactuar o cambiar el ancho.':'Usará una altura inicial y desplazamiento dentro del marco. Útil si tu editor elimina el script de ajuste.';
 $('embedCode').value=code;for(const id of ['copyIframe','selectEmbed','downloadEmbed'])$(id).disabled=!code;
 $('publishStatus').textContent=status;$('publishStatus').classList.toggle('is-error',error);
}
function downloadHTML(){
 const session=publishSession;if(!session?.html)return;download(slug()+'-'+session.snapshot.tool+'.html',session.html,'text/html;charset=utf-8');toast('HTML preparado. Sube este único archivo a una carpeta pública de tu web.');
}
function exportSVG(){try{download(slug()+'-resultados.svg',E.svg(data,{sort,dateLabel:dateLabel(data.updated),theme}),'image/svg+xml');toast('Gráfico SVG preparado. Si la descarga no comienza, pulsa su enlace.');}catch(error){toast(error.message);}}
function openAdvanced(){
 let dialog=$('advancedDialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='advancedDialog';dialog.className='advanced-dialog';dialog.setAttribute('aria-label','Estudio gráfico avanzado de Electa');document.body.appendChild(dialog);}
 dialog.innerHTML='<div class="advanced-dialog-bar"><b>Estudio gráfico avanzado</b><button class="btn small" id="closeAdvanced">Volver a Electa</button></div><iframe title="Estudio gráfico avanzado" class="advanced-dialog-frame"></iframe>';
 dialog.querySelector('iframe').srcdoc=window.ELECTA_ADVANCED_HTML;dialog.querySelector('#closeAdvanced').onclick=()=>dialog.close();dialog.showModal();
}
function openProject(){const dialog=$('projectDialog');dialog.innerHTML=`<div class="dialog-body"><div class="dialog-header"><h2 id="projectTitle">Tu proyecto electoral</h2><button id="closeProject" aria-label="Cerrar">${icon('close')}</button></div><p class="dialog-description">Conserva una copia de tus datos o continúa una cobertura guardada. Puedes llevar el proyecto a otro navegador o dispositivo.</p><div class="project-options"><button class="btn" id="backupProject">${icon('download')}Descargar proyecto JSON<small>Datos y configuración de la cobertura</small></button><button class="btn" id="loadProject">${icon('folder')}Abrir proyecto JSON<small>Sustituye el borrador de este navegador</small></button></div><div class="dialog-actions"><a class="btn" data-module-download href="Electa_Droma_v1_3_0.zip" download>${icon('download')}Descargar módulo para Dröma</a><button class="btn" id="resetDemo">${icon('refresh')}Restablecer demostración</button></div><p class="dialog-note">El módulo para Dröma incluye la aplicación completa y una guía de instalación. Tu borrador se guarda solo en este navegador; el JSON es su copia portable.</p></div>`;if(window.ELECTA_STANDALONE)dialog.querySelector('[data-module-download]').hidden=true;$('closeProject').onclick=()=>dialog.close();$('backupProject').onclick=()=>{if(C.issues(data).errors.length)return toast('Corrige los datos antes de guardar una copia portable.');download(slug()+'.electa.json',JSON.stringify(projectSnapshot(),null,2),'application/json');toast('Copia de proyecto descargada.');};$('loadProject').onclick=()=>$('importFile').click();$('resetDemo').onclick=()=>{if(confirm('¿Sustituir el borrador actual por los datos de demostración? Descarga una copia si quieres conservarlo.')){data=C.demo();resetInteraction();save();dialog.close();render();toast('Demostración restablecida.');}};dialog.showModal();}
function openHelp(){const dialog=$('projectDialog');dialog.innerHTML=`<div class="dialog-body"><div class="dialog-header"><h2 id="projectTitle">De las cifras a la historia.</h2><button id="closeHelp" aria-label="Cerrar">${icon('close')}</button></div><p class="dialog-description">Tres pasos para empezar a contar una elección con Electa.</p><ol style="padding-left:20px;font-size:13px;line-height:1.9;color:var(--muted)"><li style="margin-bottom:15px"><b>Introduce tus datos.</b> En Datos electorales, añade partidos, votos y escaños. Identifica la fuente y la fecha. Puedes importar un CSV con cabeceras nombre, votos, porcentaje, escanos, anteriores, color.</li><li style="margin-bottom:15px"><b>Elige cómo contarlos.</b> Prueba las herramientas en la mesa de trabajo y revisa la vista de móvil. El lector puede explorar resultados, pactos y comparativas.</li><li><b>Llévalos a tu web.</b> Pulsa «Poner en mi web», copia el código y pégalo en un bloque HTML personalizado. Si tu editor no lo admite, elige «Subir un archivo» y sigue sus pasos. Vuelve a exportar cuando cambies las cifras.</li></ol><div class="draft-notice">La calculadora no cambia tus resultados. Cada visitante hace sus propias combinaciones. El editor trabaja con borradores locales, sin acceso a fuentes oficiales ni sincronización automática entre dispositivos.</div><div class="dialog-actions"><button class="btn primary" id="helpStart">Editar mis datos ${icon('arrow')}</button></div></div>`;$('closeHelp').onclick=()=>dialog.close();$('helpStart').onclick=()=>{dialog.close();page='data';render();};dialog.showModal();}
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('El archivo supera los 2 MB.');const raw=JSON.parse(await f.text()),next=C.normalize(raw);if(confirm('¿Abrir este proyecto y sustituir el borrador actual?')){data=next;resetInteraction();restoreUI(raw._electaUI);save();$('projectDialog').close();render();toast('Proyecto abierto.');}}catch(error){toast('No se pudo importar: '+error.message);}finally{e.target.value='';}};
$('csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('El CSV supera los 2 MB.');const parties=C.parseCSV(await f.text()),next=C.normalize({...data,parties});if(confirm('¿Sustituir la lista actual de partidos por los del CSV?')){data=next;resetInteraction();save();renderData();toast('CSV importado. Revisa la fuente y la identificación de los datos.');}}catch(error){toast('No se pudo importar: '+error.message);}finally{e.target.value='';}};
for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});
window.addEventListener('pagehide',flushSave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();});window.addEventListener('storage',e=>{if(e.key==='electa-droma-project-v1')toast('El proyecto ha cambiado en otra pestaña. Descarga una copia antes de continuar editando.');});
render();
window.Electa={getData:()=>JSON.parse(JSON.stringify(data)),getTool:()=>tool};
})();
</script></body></html>
